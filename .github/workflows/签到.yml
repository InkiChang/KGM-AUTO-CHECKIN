name: 签到
on:
  schedule:
    # GitHub Actions 的 schedule 只支持 UTC，不支持 timezone 字段。
    # UTC 17:10 = 北京时间 01:10（次日）
    - cron: "10 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 创建 Node 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}

      - name: 执行签到
        id: main
        run: npm run main
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 通知渠道
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 企微应用消息通知
        if: ${{ !cancelled() }}
        env:
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORP_SECRET: ${{ secrets.WECOM_CORP_SECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          CHECKIN_STATUS: ${{ steps.main.outcome }}
        run: |
          TOKEN=$(curl -s -G "https://qyapi.weixin.qq.com/cgi-bin/gettoken" \
            --data-urlencode "corpid=${WECOM_CORPID}" \
            --data-urlencode "corpsecret=${WECOM_CORP_SECRET}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -n "$TOKEN" ]; then
            curl -s "https://qyapi.weixin.qq.com/cgi-bin/message/send?access_token=${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"touser\":\"@all\",\"msgtype\":\"text\",\"agentid\":${WECOM_AGENTID},\"text\":{\"content\":\"[KGM] 酷狗签到执行完毕 状态:${CHECKIN_STATUS} 详情:https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}}"
          fi
